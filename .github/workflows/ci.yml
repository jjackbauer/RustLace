name: CI

# Five jobs:
#   windows - the full workspace: format, clippy, every test, and the release desktop build.
#   linux   - the portable engine crates, then the desktop GUI itself: built, accepted by
#             --gui-selftest and unit-tested under Xvfb. The GUI stack (eframe/egui/resvg) is
#             cross-platform; on Linux eframe compiles its glow (OpenGL) backend and the
#             workbench selects it, because wgpu cannot acquire a device on a runner with no
#             /dev/dri (the same failure WSLg shows). Windows keeps eframe's default wgpu
#             renderer untouched. Both artifacts are real GUI builds; the Linux one is accepted
#             headlessly because a CI runner has no desktop session.
#   architecture-policy - the ownership policy, the actual cargo-metadata graph, the syntax-aware
#             duplicate-numeric scan, and the mutation suite that proves each rule can fail. It is
#             independent of ordinary unit tests: a green test suite cannot outvote a second
#             rational implementation. Runs on Linux and Windows.
#   numerical-kernel - the canonical rational kernel, its seeded property campaigns, the
#             independent Python Fraction/Systems oracles and the cross-library semantic tests.
#   docs    - every fenced example executed: the language and extension example runners, the Rust
#             fences in docs/crates/*.md compiled and run, and the four tutorials run as contracts;
#             the language runner also checks docs/language/builtins.md against the built runner's
#             `--functions` registry, so a renamed, removed or misclassified builtin fails here;
#             then all three check-docs modes, the reference-page contract, and the mutation
#             self-test that proves each of those gates can fail - on Linux and Windows.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (full workspace)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # -D warnings is deliberately NOT used: the workspace has pre-existing warnings
      # (dead code, deprecated egui API, missing_docs), recorded in docs; making them
      # fatal would be a separate cleanup, not a CI prerequisite.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The parity gate is a blocking step, not a side effect of cargo test:
      # cargo test --workspace does not execute the release corpus binary. The
      # release build is mandatory because the debug binary overflows its
      # main-thread stack at lang/061; a mismatch, panic, unexpected skip or
      # non-zero exit must fail the workflow.
      - name: Run the release corpus gate
        run: cargo run --release -p lovelace-corpus

      - name: Build release desktop
        run: cargo build --release -p lovelace-desktop

      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: lovelace-desktop-windows-x86_64
          path: target/release/lovelace-desktop.exe
          if-no-files-found: error

  linux:
    name: Linux (engine crates + GUI desktop under Xvfb)
    # Pinned to the current Ubuntu LTS, deliberately NOT ubuntu-latest: this job publishes the
    # Linux GUI artifact, so its runner fixes the artifact's ABI floor. The artifact has to run on
    # Ubuntu 24.04 (glibc 2.39), and ubuntu-latest had already moved ahead of the LTS: run
    # 43674629253 produced a binary that died on 24.04 with
    #   /lib/x86_64-linux-gnu/libm.so.6: version `GLIBC_2.43' not found
    # Move this pin only when a newer LTS becomes the supported floor, never back to "latest".
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # The GUI stack loads X11, GL and xkbcommon through dlopen (winit, glutin, xkbcommon-dl),
      # so none of these is a link-time build dependency: they are the window, GL and font
      # runtime the GUI needs on a runner with no desktop session. Two entries are additions to
      # the documented list: libgl1-mesa-dri supplies mesa's llvmpipe (the GL implementation
      # Xvfb has, because a runner has no GPU), and libxkbcommon-x11-0 is the X11 keyboard
      # backend winit dlopens (libxkbcommon-dev only pulls libxkbcommon0).
      - name: Install Linux GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libwayland-dev pkg-config \
            fonts-urw-base35 \
            xvfb xauth x11-utils

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy engine crates
        run: cargo clippy -p lovelace-lang -p lovelace-real -p lovelace-nat -p lovelace-symbolics -p lovelace-systems --all-targets

      - name: Test engine crates
        run: cargo test -p lovelace-lang -p lovelace-real -p lovelace-symbolics -p lovelace-systems

      # Same blocking parity gate as the Windows job: the release corpus run is
      # not covered by the engine test suites. Linux is a second independent
      # execution surface for the corpus, so a platform-specific mismatch fails
      # here rather than only on Windows.
      - name: Run the release corpus gate
        run: cargo run --release -p lovelace-corpus

      # The desktop builds as the product on Linux: the same workbench, editor, panes, plot
      # rasteriser and journeys the Windows binary carries, rendered through glow.
      - name: Build release desktop (GUI)
        run: cargo build --release -p lovelace-desktop

      # ABI guard, cheap and right after the build. The artifact is built on the runner, so the
      # newest glibc symbol it references is the newest glibc any user must have - and that is
      # exactly how run 43674629253 shipped a GLIBC_2.43 binary to users on 24.04 (glibc 2.39).
      # Print both versions, then fail when the artifact needs more glibc than the runner that
      # publishes it provides. That turns "artifact outruns the LTS" into a CI failure instead of
      # a user-facing `version GLIBC_2.43 not found`, and it catches a future ubuntu-24.04 image
      # refresh as well as an accidental return to a newer label.
      - name: Guard the artifact's glibc requirement
        run: |
          set -euo pipefail
          exe=target/release/lovelace-desktop
          # Highest GLIBC_2.x referenced by the dynamic symbol table (empty if none found).
          required=$(objdump -T "$exe" | grep -o 'GLIBC_2\.[0-9]*' | sort -u -V | tail -1 || true)
          required=${required#GLIBC_}
          # sed, not `head -1`: ldd writes several lines and head would SIGPIPE it, which prints
          # "printf: write error: Broken pipe" into the log and reads like a guard failure.
          runner=$(ldd --version | sed -n 1p | grep -oE '[0-9]+\.[0-9]+$' || true)
          echo "artifact:          $exe"
          echo "requires glibc <=  ${required:-unknown}"
          echo "runner provides    ${runner:-unknown}  ($(ldd --version | sed -n 1p))"
          if [ -z "$required" ] || [ -z "$runner" ]; then
            echo "::error title=glibc ABI::could not determine the artifact's or the runner's glibc version"
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$required" "$runner" | sort -V | tail -1)
          if [ "$highest" != "$runner" ]; then
            echo "::error title=glibc ABI::$exe requires glibc $required but this runner provides only $runner"
            exit 1
          fi
          echo "glibc ABI OK: $required <= $runner"

      # --gui-selftest drives the shipped Workbench through the same run path the window calls.
      # checks=20 is the Windows count: the undo/redo check used to be Windows-only on this
      # build, so the count is asserted rather than only "failed=0" - Linux must not quietly
      # lose a check. The summary is teed so the log keeps the per-check lines.
      - name: Run the workbench self-test under Xvfb
        run: |
          unset WAYLAND_DISPLAY
          xvfb-run -a -s "-screen 0 1600x1000x24" ./target/release/lovelace-desktop --gui-selftest | tee gui-selftest.log
          grep -q 'GUI_SELFTEST summary checks=20 failed=0' gui-selftest.log

      # The GUI-dependent unit and integration tests (editor, panes, themes, plot rasteriser,
      # journeys) only compile when the egui surface does; they run under the same Xvfb screen.
      - name: Test desktop under Xvfb
        run: xvfb-run -a -s "-screen 0 1600x1000x24" cargo test -p lovelace-desktop

      # Renamed from lovelace-desktop-linux-x86_64: that name described the old headless build.
      # This is the GUI binary the Linux port produced.
      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: lovelace-desktop-linux-gui-x86_64
          path: target/release/lovelace-desktop
          if-no-files-found: error

  # The documentation examples are executable documentation: each runner parses
  # the fenced blocks out of the Markdown and compares every observed typed
  # output with the recorded one. The matrix is the point - a runner that only
  # works on one platform (path shapes, .exe discovery, line endings) must fail
  # on the platform that has the bug, not pass because it was never run there.
  # The consistency gates and their self-test run in both variants for the same
  # reason: the checkers are bash, so a line-ending or path-shape defect must
  # fail on the platform that has it.
  docs:
    name: Documentation examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # windows-latest checks out with the runner's system core.autocrlf=true,
      # which would give the bash runners CRLF and break them before they run.
      # Pin LF for this job's checkout only; the windows and linux jobs above
      # keep their existing checkout behaviour.
      - name: Checkout
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build lovelace-run
        run: cargo build -p lovelace-run

      # Agent contracts, their mutation probes and coverage inventory run
      # together as one named gate in docs-report.sh below. Do not duplicate
      # these expensive checks as standalone steps here.

      # Compiles and runs every maintained ```rust fence under docs/crates/
      # against the workspace crates. The script locates cargo itself ($CARGO,
      # then PATH, then $HOME/.cargo/bin/cargo, then
      # %USERPROFILE%/.cargo/bin/cargo.exe in Git Bash), so the gate cannot
      # pass by not finding a compiler: it exits 2 instead. `shell: bash` is
      # the system bash on ubuntu-latest and Git Bash on windows-latest; both
      # variants run this step unconditionally.
      - name: Compile and run the crate-page examples
        shell: bash
        run: bash tools/check-crate-examples.sh

      # Executes the four tutorials as contracts: each page's ## Source block
      # is run through the lovelace-run built above and its output is compared
      # with the recorded ## Output block. Unconditional, like every other
      # gate here; the runner is found under target/{debug,release}.
      - name: Run the tutorials
        shell: bash
        run: bash tools/run-tutorials.sh

      # `shell: bash` is the system bash on ubuntu-latest and Git Bash on
      # windows-latest. Both runners always execute; the step fails if either
      # exits non-zero, so a wrong recorded output fails the workflow. The
      # language runner verifies the fenced examples and then the builtin
      # catalogue in docs/language/builtins.md against `lovelace-run
      # --functions`; that second pass is why the step needs the runner built
      # above, and it fails on either OS when a documented builtin is renamed,
      # removed, misclassified or missing from the page.
      - name: Run the language and extension examples
        shell: bash
        run: |
          set -uo pipefail
          status=0
          bash docs/language/examples/run-examples.sh || status=1
          bash docs/extensions/examples/run-examples.sh || status=1
          exit "$status"

      # Every ```lovelace snippet under docs/ is executed against the runner
      # built above and compared with the ```text block that immediately
      # follows it. The family runners above stay authoritative for their
      # trees; this is the backstop that catches a guide page (for example
      # docs/systems-analysis.md) documenting a call the current language no
      # longer produces. The language pages run in their documented default
      # mode (--text, with the variable line); every other page runs in the
      # extension mode (--text --omit-variables). A snippet whose output is
      # not recorded is a failure, not a skip.
      - name: Run every documented Lovelace example
        shell: bash
        run: bash tools/check-doc-examples.sh

      # The documentation consistency gate has three implemented modes, and all
      # three run. check-docs.sh always performs the relative-link and
      # path-shaped-code-reference pass; each flag adds one audit on top of it:
      #   --symbols  no .rs:NNN citations outside docs/adr/ and no dead symbols
      #   --claims   no prohibited absolutist claim, every tutorial has ## Precision
      #   --readme   README value proposition, limitations, command and order
      # Separate steps keep a failure attributable to one mode. No step is
      # conditional and none is allowed to fail without failing the job.
      - name: Check documentation links and symbol citations
        shell: bash
        run: bash tools/check-docs.sh --symbols

      - name: Check documentation claims and tutorial precision
        shell: bash
        run: bash tools/check-docs.sh --claims

      - name: Check the README structure
        shell: bash
        run: bash tools/check-docs.sh --readme

      # The reference-page contract (DOC-014): every page listed in
      # docs/reference-pages.md carries the seven sections of
      # docs/reference-template.md, in order, with no other level-2 heading.
      - name: Check reference pages
        shell: bash
        run: bash tools/check-reference-pages.sh

      # Each gate above has a recorded mutation test: tools/test-docs-gates.sh
      # builds the defect in a scratch tree, runs the real checker against it,
      # and requires a non-zero exit with a diagnostic naming the file and the
      # problem. A mutation that stops failing fails this step, so a gate
      # cannot quietly become a no-op. It also asserts that this workflow still
      # invokes every mode, so the self-test goes red when a mode is removed
      # from the job instead of passing on a smaller set.
      - name: Test the documentation gates (mutation)
        shell: bash
        run: bash tools/test-docs-gates.sh

      # One transcript of every gate above, with a machine-readable DOCREPORT
      # line per gate and a total carrying the commit and OS (RQ-023). It is
      # additive for the existing standalone documentation checks; agent
      # contract checks run only here, as a named sub-gate, to avoid duplicated
      # expensive work. Every failure is attributable in DOCREPORT, and the
      # step fails for any nonzero or contradictory gate result. Both matrix
      # legs run it unconditionally and upload their transcript below.
      - name: Report documentation evidence
        shell: bash
        run: |
          set -uo pipefail
          bash tools/docs-report.sh | tee "docs-report-${{ matrix.os }}.log"

      # The per-OS transcript is the evidence artifact for this leg. Like every
      # step in this job it is unconditional: no condition, no failure
      # suppression, so a red report fails the job instead of handing over a
      # green artifact.
      - name: Upload the documentation evidence transcript
        uses: actions/upload-artifact@v4
        with:
          name: docs-report-${{ matrix.os }}
          path: docs-report-${{ matrix.os }}.log
          if-no-files-found: error

  # The architecture gate is deliberately not a step inside `windows` or `linux`: it must fail the
  # merge even when every application test passes, and it must be attributable as its own required
  # status check. It reads the policy, asks cargo for the real workspace graph, and scans the Rust
  # items rather than filenames. The mutation suite proves each mandatory rule can fail; the valid
  # fixture proves domain formulas, typed units and legal aliases are accepted. Both OS variants
  # run it because the checker and its fixtures must not depend on path shape or line endings.
  architecture-policy:
    name: Architecture policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # A zero-violation result is not enough: the checker itself fails with exit 2 when it cannot
      # parse the policy, enumerate the workspace or complete the scan. The report is the
      # architecture impact summary required for PRs that touch crates, numeric types or edges.
      - name: Check the architecture policy and dependency graph
        run: python tools/check-architecture.py --report architecture-impact-${{ matrix.os }}.md

      - name: Mutation-test the architecture gates
        run: python tools/test-architecture-gates.py

      # The oracle fixtures are generated by an independent Python implementation. A stale fixture
      # means the recorded expected values no longer describe the oracle; that fails here rather
      # than passing a compatibility test against itself.
      - name: Verify the rational oracle fixture
        run: python tools/rational-oracle.py --check

      - name: Verify the systems oracle fixture
        run: python tools/systems-oracle.py --check

      - name: Upload the architecture impact report
        uses: actions/upload-artifact@v4
        with:
          name: architecture-impact-${{ matrix.os }}
          path: architecture-impact-${{ matrix.os }}.md
          if-no-files-found: error

  # The numerical-kernel gate is separate from the workspace suite so a kernel or cross-library
  # regression is attributable. It runs the canonical rational tests, the seeded property
  # campaigns, both independent oracles and the Symbolics/Systems/language equivalence tests.
  numerical-kernel:
    name: Numerical kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Test the canonical numeric crates
        run: cargo test -p lovelace-rational -p lovelace-int -p lovelace-nat -p lovelace-real

      - name: Run the seeded rational property campaigns
        run: cargo test -p lovelace-rational --test properties

      - name: Compare rational arithmetic with the independent Python oracle
        run: cargo test -p lovelace-rational --test oracle

      - name: Compare systems results with the independent Python oracle
        run: cargo test -p lovelace-systems --test oracle

      - name: Cross-library exactness, sign and error semantics
        run: cargo test -p lovelace-lang --test cross_library

