name: CI

# Two jobs:
#   windows - the full workspace: format, clippy, every test, and the release desktop build.
#   linux   - the portable engine crates, then the desktop GUI itself: built, accepted by
#             --gui-selftest and unit-tested under Xvfb. The GUI stack (eframe/egui/resvg) is
#             cross-platform; on Linux eframe compiles its glow (OpenGL) backend and the
#             workbench selects it, because wgpu cannot acquire a device on a runner with no
#             /dev/dri (the same failure WSLg shows). Windows keeps eframe's default wgpu
#             renderer untouched. Both artifacts are real GUI builds; the Linux one is accepted
#             headlessly because a CI runner has no desktop session.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (full workspace)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # -D warnings is deliberately NOT used: the workspace has pre-existing warnings
      # (dead code, deprecated egui API, missing_docs), recorded in docs; making them
      # fatal would be a separate cleanup, not a CI prerequisite.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Build release desktop
        run: cargo build --release -p lovelace-desktop

      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: lovelace-desktop-windows-x86_64
          path: target/release/lovelace-desktop.exe
          if-no-files-found: error

  linux:
    name: Linux (engine crates + GUI desktop under Xvfb)
    # Pinned to the current Ubuntu LTS, deliberately NOT ubuntu-latest: this job publishes the
    # Linux GUI artifact, so its runner fixes the artifact's ABI floor. The artifact has to run on
    # Ubuntu 24.04 (glibc 2.39), and ubuntu-latest had already moved ahead of the LTS: run
    # 43674629253 produced a binary that died on 24.04 with
    #   /lib/x86_64-linux-gnu/libm.so.6: version `GLIBC_2.43' not found
    # Move this pin only when a newer LTS becomes the supported floor, never back to "latest".
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # The GUI stack loads X11, GL and xkbcommon through dlopen (winit, glutin, xkbcommon-dl),
      # so none of these is a link-time build dependency: they are the window, GL and font
      # runtime the GUI needs on a runner with no desktop session. Two entries are additions to
      # the documented list: libgl1-mesa-dri supplies mesa's llvmpipe (the GL implementation
      # Xvfb has, because a runner has no GPU), and libxkbcommon-x11-0 is the X11 keyboard
      # backend winit dlopens (libxkbcommon-dev only pulls libxkbcommon0).
      - name: Install Linux GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libwayland-dev pkg-config \
            fonts-urw-base35 \
            xvfb xauth x11-utils

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy engine crates
        run: cargo clippy -p lovelace-lang -p lovelace-real -p lovelace-nat -p lovelace-symbolics --all-targets

      - name: Test engine crates
        run: cargo test -p lovelace-lang -p lovelace-real -p lovelace-symbolics

      # The desktop builds as the product on Linux: the same workbench, editor, panes, plot
      # rasteriser and journeys the Windows binary carries, rendered through glow.
      - name: Build release desktop (GUI)
        run: cargo build --release -p lovelace-desktop

      # ABI guard, cheap and right after the build. The artifact is built on the runner, so the
      # newest glibc symbol it references is the newest glibc any user must have - and that is
      # exactly how run 43674629253 shipped a GLIBC_2.43 binary to users on 24.04 (glibc 2.39).
      # Print both versions, then fail when the artifact needs more glibc than the runner that
      # publishes it provides. That turns "artifact outruns the LTS" into a CI failure instead of
      # a user-facing `version GLIBC_2.43 not found`, and it catches a future ubuntu-24.04 image
      # refresh as well as an accidental return to a newer label.
      - name: Guard the artifact's glibc requirement
        run: |
          set -euo pipefail
          exe=target/release/lovelace-desktop
          # Highest GLIBC_2.x referenced by the dynamic symbol table (empty if none found).
          required=$(objdump -T "$exe" | grep -o 'GLIBC_2\.[0-9]*' | sort -u -V | tail -1 || true)
          required=${required#GLIBC_}
          runner=$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$' || true)
          echo "artifact:          $exe"
          echo "requires glibc <=  ${required:-unknown}"
          echo "runner provides    ${runner:-unknown}  ($(ldd --version | head -1))"
          if [ -z "$required" ] || [ -z "$runner" ]; then
            echo "::error title=glibc ABI::could not determine the artifact's or the runner's glibc version"
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$required" "$runner" | sort -V | tail -1)
          if [ "$highest" != "$runner" ]; then
            echo "::error title=glibc ABI::$exe requires glibc $required but this runner provides only $runner"
            exit 1
          fi
          echo "glibc ABI OK: $required <= $runner"

      # --gui-selftest drives the shipped Workbench through the same run path the window calls.
      # checks=20 is the Windows count: the undo/redo check used to be Windows-only on this
      # build, so the count is asserted rather than only "failed=0" - Linux must not quietly
      # lose a check. The summary is teed so the log keeps the per-check lines.
      - name: Run the workbench self-test under Xvfb
        run: |
          unset WAYLAND_DISPLAY
          xvfb-run -a -s "-screen 0 1600x1000x24" ./target/release/lovelace-desktop --gui-selftest | tee gui-selftest.log
          grep -q 'GUI_SELFTEST summary checks=20 failed=0' gui-selftest.log

      # The GUI-dependent unit and integration tests (editor, panes, themes, plot rasteriser,
      # journeys) only compile when the egui surface does; they run under the same Xvfb screen.
      - name: Test desktop under Xvfb
        run: xvfb-run -a -s "-screen 0 1600x1000x24" cargo test -p lovelace-desktop

      # Renamed from lovelace-desktop-linux-x86_64: that name described the old headless build.
      # This is the GUI binary the Linux port produced.
      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: lovelace-desktop-linux-gui-x86_64
          path: target/release/lovelace-desktop
          if-no-files-found: error
