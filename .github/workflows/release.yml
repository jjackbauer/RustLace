name: Release

# Automatic release.
#
# The workflow starts only when the CI workflow finishes successfully for a
# push to main, so nothing is ever tagged from a red or unvalidated tree. The
# triggering run's head SHA is checked out with full history and tags; the next
# version is a pure function of the commits since the last vX.Y.Z tag (see
# tools/next-version.ps1 and docs/release.md).
#
# The guard decides one of three things and logs which branch it took:
#   * the tag and its GitHub Release both exist -> stop (true idempotency):
#     this version is already published, so a re-run or a replayed event
#     cannot publish it twice;
#   * the tag exists but its GitHub Release does not -> recover: build from
#     that tag and create the release, skipping the version bump, commit and
#     push (the tag is already the release commit);
#   * neither exists -> normal path (or a logged stop when the range warrants
#     no release, or when main has moved past the CI-validated commit).
#
# `cargo metadata` refreshes Cargo.lock for the new workspace version, the
# committed message carries [skip ci] so the release commit cannot start CI
# again, and main plus the tag are pushed atomically: either both move or
# neither does.
#
# Every release carries TWO executables, both built from the tagged commit:
#
#   lovelace-desktop.exe            Windows x86_64, attached by the `release` job
#   SHA256SUMS.windows              its digest, written by the `release` job
#   lovelace-desktop-linux-x86_64   Linux x86_64, attached by the `linux` job
#   SHA256SUMS.linux                its digest, written by the `linux` job
#
# The `release` job creates the tag and the GitHub Release on windows-latest.
# The `linux` job needs it, reads the tag from its job outputs, checks that tag
# out again (never main) and uploads its two files with `gh release upload`;
# it never creates the release. Each job hashes only the file it built, so no
# checksum can describe the other platform's bytes and no job has to download
# the other's asset.
#
# Each executable is built HERE, at the release commit the job creates and
# tags, with `cargo build --release -p lovelace-desktop`, so the version
# compiled in from [workspace.package] is the version in the tag. Both jobs run
# the built file with --version and fail unless it prints the tagged version,
# which is what makes an asset that disagrees with its tag impossible. The
# pre-bump CI artifact is deliberately not attached.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# Overlapping releases for the same ref queue instead of racing; the guard's
# tag-and-release check makes a queued duplicate run a no-op.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Tag and publish
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest

    # Consumed by the `linux` job. `released` is false on every guard stop, so
    # the Linux job runs only when this job created (or recovered) the release.
    outputs:
      released: ${{ steps.guard.outputs.release }}
      tag: ${{ steps.guard.outputs.tag }}

    steps:
      - name: Check out the CI-validated commit with full history and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch every tag from origin
        shell: pwsh
        run: git fetch --tags --force origin

      - name: Decide the next version from the commit history
        id: next
        shell: pwsh
        run: |
          $verdict = & ./tools/next-version.ps1 -RepoRoot . -Json | ConvertFrom-Json
          Write-Output "previous=$($verdict.previous) next=$($verdict.next) bump=$($verdict.bump) reason=`"$($verdict.reason)`" policy=$($verdict.policy)"
          Write-Output "range=$($verdict.range) commits=$($verdict.inspected)"
          "previous=$($verdict.previous)" >> $env:GITHUB_OUTPUT
          "next=$($verdict.next)" >> $env:GITHUB_OUTPUT
          "bump=$($verdict.bump)" >> $env:GITHUB_OUTPUT
          "reason=$($verdict.reason)" >> $env:GITHUB_OUTPUT
          "policy=$($verdict.policy)" >> $env:GITHUB_OUTPUT

      - name: Decide whether to release, recover, or stop
        id: guard
        shell: pwsh
        env:
          PREVIOUS: ${{ steps.next.outputs.previous }}
          NEXT: ${{ steps.next.outputs.next }}
          BUMP: ${{ steps.next.outputs.bump }}
          REASON: ${{ steps.next.outputs.reason }}
          REPO: ${{ github.repository }}
        run: |
          # Native commands below are expected to fail (a missing tag, a missing
          # release); their exit codes are data, so do not let a redirected
          # stderr become a terminating error.
          $ErrorActionPreference = 'Continue'
          $tag = "v$env:NEXT"
          "tag=$tag" >> $env:GITHUB_OUTPUT

          function Stop-Guard {
            param([string] $Message)
            "release=false" >> $env:GITHUB_OUTPUT
            "mode=none" >> $env:GITHUB_OUTPUT
            Write-Output $Message
            exit 0
          }

          $tagSha = $null
          $tagRef = git rev-parse -q --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0 -and $tagRef) {
            $tagSha = (git rev-list -n 1 "refs/tags/$tag").Trim()
          }

          $releaseExists = $false
          gh release view $tag --repo $env:REPO --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }

          if ($tagSha -and $releaseExists) {
            Stop-Guard "guard branch: TAG AND RELEASE EXIST -> idempotent stop. Tag $tag is at $tagSha and GitHub Release $tag exists; this version is already published and nothing is created."
          }

          if ($releaseExists -and -not $tagSha) {
            Stop-Guard "guard branch: RELEASE WITHOUT TAG -> stop. GitHub Release $tag exists but the git tag does not; that state needs a human, not a guess."
          }

          if ($tagSha) {
            $head = (git rev-parse HEAD).Trim()
            git merge-base --is-ancestor $head $tagSha 2>$null
            if ($LASTEXITCODE -ne 0) {
              Stop-Guard "guard branch: TAG WITHOUT RELEASE, FOREIGN COMMIT -> stop. Tag $tag is at $tagSha with no GitHub Release, but the CI-validated commit $head is not that commit or an ancestor of it; refusing to publish a tree CI did not validate."
            }
            "release=true" >> $env:GITHUB_OUTPUT
            "mode=recovery" >> $env:GITHUB_OUTPUT
            Write-Output "guard branch: TAG WITHOUT RELEASE -> recovery. Tag $tag is at $tagSha and has no GitHub Release; building from the tag and creating the release. The version bump, release commit and tag push are skipped because the tag already exists."
            exit 0
          }

          # Neither the tag nor its release exists: the normal path.
          if ($env:BUMP -eq 'none') {
            Stop-Guard "guard branch: NEITHER TAG NOR RELEASE, NO BUMP -> stop. Nothing in this range warrants a release ($env:REASON); no tag $tag was created."
          }

          # The release commit is pushed onto main, so it may only be based on
          # the current tip. A stale CI run must not resurrect an older tree.
          git fetch --quiet origin main
          if ($LASTEXITCODE -ne 0) { throw 'could not read origin/main' }
          $head = (git rev-parse HEAD).Trim()
          $mainTip = (git rev-parse FETCH_HEAD).Trim()
          if ($head -ne $mainTip) {
            Stop-Guard "guard branch: NEITHER TAG NOR RELEASE, STALE RUN -> stop. CI validated $head but main is at $mainTip; the newer commit needs its own green CI run."
          }
          "release=true" >> $env:GITHUB_OUTPUT
          "mode=normal" >> $env:GITHUB_OUTPUT
          Write-Output "guard branch: NEITHER TAG NOR RELEASE -> normal release path. previous=$env:PREVIOUS next=$env:NEXT bump=$env:BUMP tag=$tag will be built, committed, tagged and published."

      - name: Install stable Rust
        if: steps.guard.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        if: steps.guard.outputs.release == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Bump the workspace version and refresh Cargo.lock
        if: steps.guard.outputs.release == 'true' && steps.guard.outputs.mode == 'normal'
        shell: pwsh
        env:
          PREVIOUS: ${{ steps.next.outputs.previous }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          $path = Join-Path (Get-Location) 'Cargo.toml'
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          # Preserve the file's existing newline convention so the bump commit
          # changes one line, not every line.
          $newline = if ($text.Contains("`r`n")) { "`r`n" } elseif ($text.Contains("`n")) { "`n" } else { "`r`n" }
          $lines = $text -split "`r?`n"
          $inSection = $false
          $changed = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $line = $lines[$i]
            if ($line -match '^\s*\[([^\]]+)\]\s*$') {
              $inSection = ($matches[1].Trim() -eq 'workspace.package')
              continue
            }
            if (-not $inSection) { continue }
            if ($line -match '^(\s*version\s*=\s*")([^"]+)(".*)$') {
              if ($matches[2] -ne $env:PREVIOUS) {
                throw "workspace version is $($matches[2]), but the verdict says $env:PREVIOUS"
              }
              $lines[$i] = $matches[1] + $env:NEXT + $matches[3]
              $changed = $true
              break
            }
          }
          if (-not $changed) { throw '[workspace.package] version line not found' }
          [System.IO.File]::WriteAllText($path, ($lines -join $newline), (New-Object System.Text.UTF8Encoding($false)))
          # Resolve the workspace so Cargo.lock records the new member versions.
          $metadata = Join-Path $env:TEMP 'rustlace-cargo-metadata.json'
          cargo metadata --format-version 1 > $metadata
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed after the version bump' }
          Remove-Item -LiteralPath $metadata -Force
          Write-Output "Cargo.toml: $((Select-String -Path Cargo.toml -Pattern '^version = "').Line)"
          git --no-pager diff --stat

      - name: Commit the bump, create the tag and push both atomically
        id: tag
        if: steps.guard.outputs.release == 'true' && steps.guard.outputs.mode == 'normal'
        shell: pwsh
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): $env:TAG [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git tag -a $env:TAG -m "RustLace $env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'git tag failed' }
          git push --atomic origin "HEAD:main" "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'the atomic push of main and the tag failed' }
          Write-Output "pushed $env:TAG for $((git rev-parse HEAD).Trim())"

      - name: Check out the release tag that will be built
        if: steps.guard.outputs.release == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          git fetch --tags --force origin
          if ($LASTEXITCODE -ne 0) { throw 'could not fetch tags' }
          git checkout --detach "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "could not check out tag $env:TAG" }
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 "refs/tags/$env:TAG").Trim()
          if ($head -ne $tagCommit) { throw "HEAD $head is not the commit of tag $env:TAG ($tagCommit)" }
          Write-Output "checked out $env:TAG at $head"

      - name: Build the desktop executable at the tagged commit
        if: steps.guard.outputs.release == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          cargo build --release -p lovelace-desktop
          if ($LASTEXITCODE -ne 0) { throw "the release build failed at tag $env:TAG" }
          $exe = Join-Path (Get-Location) 'target/release/lovelace-desktop.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "the build did not produce $exe" }
          Write-Output "built $exe ($((Get-Item -LiteralPath $exe).Length) bytes) from $env:TAG"

      - name: Verify the built executable reports the tagged version
        id: verify
        if: steps.guard.outputs.release == 'true'
        shell: pwsh
        env:
          NEXT: ${{ steps.next.outputs.next }}
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          $exe = Join-Path (Get-Location) 'target/release/lovelace-desktop.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "missing $exe" }
          $output = & $exe --version 2>&1
          $exit = $LASTEXITCODE
          $text = (@($output) -join "`n").Trim()
          Write-Output "$exe --version -> '$text' (exit $exit)"
          if ($exit -ne 0) { throw "lovelace-desktop --version exited $exit" }
          $expected = "lovelace-desktop $env:NEXT"
          if ($text -ne $expected) {
            throw "asset/tag version mismatch: tag $env:TAG requires '$expected' but the built executable printed '$text'"
          }
          "version=$env:NEXT" >> $env:GITHUB_OUTPUT
          Write-Output "verified: the built executable prints the tagged version $env:NEXT"

      - name: Write SHA256SUMS.windows over the built executable
        id: checksum
        if: steps.guard.outputs.release == 'true'
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'target/release/lovelace-desktop.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "missing $exe" }
          $item = Get-Item -LiteralPath $exe
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # Platform-qualified name: the release also carries SHA256SUMS.linux, and a bare
          # SHA256SUMS cannot say which executable it describes.
          "$hash  lovelace-desktop.exe" | Set-Content -Path SHA256SUMS.windows -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$($item.Length)" >> $env:GITHUB_OUTPUT
          Write-Output "sha256 $hash"
          Write-Output "size   $($item.Length) bytes"
          Get-Content SHA256SUMS.windows

      - name: Generate the release notes
        if: steps.guard.outputs.release == 'true'
        shell: pwsh
        env:
          NEXT: ${{ steps.next.outputs.next }}
          TAG: ${{ steps.guard.outputs.tag }}
          REPO: ${{ github.repository }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          SIZE: ${{ steps.checksum.outputs.size }}
        run: |
          # Compare against the release before this tag, not against the tag
          # itself (HEAD is the tagged commit here).
          $previousTag = $null
          $described = & git describe --tags --abbrev=0 --match 'v[0-9]*' "$($env:TAG)^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $described) { $previousTag = ([string] $described).Trim() }
          $arguments = @{
            Version     = $env:NEXT
            OutputPath  = 'RELEASE_NOTES.md'
            Repository  = $env:REPO
            CiUrl       = $env:CI_URL
            CiSha       = $env:CI_SHA
            Sha256      = $env:SHA256
            SizeBytes   = $env:SIZE
          }
          if ($previousTag) { $arguments['PreviousTag'] = $previousTag }
          & ./tools/release-notes.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw 'release-notes.ps1 failed' }
          Get-Content RELEASE_NOTES.md

      - name: Publish the GitHub Release with the Windows executable and checksum
        if: steps.guard.outputs.release == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.guard.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $exe = Join-Path (Get-Location) 'target/release/lovelace-desktop.exe'
          foreach ($asset in @($exe, (Join-Path (Get-Location) 'SHA256SUMS.windows'))) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "missing release asset $asset" }
          }
          gh release create $env:TAG --repo $env:REPO --verify-tag --title "RustLace $env:TAG" --notes-file RELEASE_NOTES.md $exe SHA256SUMS.windows
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          gh release view $env:TAG --repo $env:REPO --json tagName,name,assets

  # ---------------------------------------------------------------------------
  # The Linux executable.
  #
  # `needs: release` is the ordering AND the gate: the job runs only after the
  # `release` job has created the tag and the GitHub Release, and only when the
  # guard's `released` output is true. It checks the tag out itself, so the
  # Linux binary is built from exactly the released commit -- not from main and
  # not from CI's pre-bump artifact. It never creates a release; it uploads the
  # two files it built to the release the other job created.
  # ---------------------------------------------------------------------------
  linux:
    name: Publish the Linux executable
    needs: release
    if: needs.release.outputs.released == 'true'
    # Same pin as the Linux job in ci.yml, deliberately not ubuntu-latest: the
    # runner fixes the glibc floor of the binary users download. ubuntu-24.04
    # provides glibc 2.39 (docs/release.md states the floor). Move this pin only
    # when the supported floor moves.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the release tag, not main
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      # The checkout action already resolves the tag; this step proves the
      # property the release depends on rather than trusting the ref input.
      - name: Prove the checkout is the tagged commit
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error title=linux release::the release job produced no tag"
            exit 1
          fi
          git fetch --tags --force origin
          head=$(git rev-parse HEAD)
          tag_commit=$(git rev-list -n 1 "refs/tags/$TAG")
          echo "HEAD        $head"
          echo "$TAG ->     $tag_commit"
          if [ "$head" != "$tag_commit" ]; then
            echo "::error title=linux release::HEAD $head is not the commit of tag $TAG ($tag_commit)"
            exit 1
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Exactly the package list ci.yml installs for the Linux GUI build. The GUI
      # stack loads X11, GL and xkbcommon through dlopen, so these are the build
      # and runtime dependencies; libgl1-mesa-dri supplies llvmpipe for a runner
      # with no GPU. `libegl1-mesa-dev` is the package name (not libegl-mesa-dev),
      # and ci.yml is the source of truth for this list.
      - name: Install the Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libwayland-dev pkg-config \
            fonts-urw-base35 \
            xvfb xauth x11-utils

      - name: Build the Linux executable at the tagged commit
        run: cargo build --release -p lovelace-desktop

      # The same guard the Windows job runs: the released file must print the
      # tag's version. A mismatch fails the job, so the release cannot gain a
      # Linux asset that disagrees with its tag.
      - name: Verify the Linux executable reports the tagged version
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          exe=target/release/lovelace-desktop
          if [ ! -x "$exe" ]; then
            echo "::error title=linux release::the build did not produce $exe"
            exit 1
          fi
          version=${TAG#v}
          expected="lovelace-desktop $version"
          status=0
          output=$("$exe" --version 2>&1) || status=$?
          echo "$exe --version -> '$output' (exit $status)"
          if [ "$status" -ne 0 ]; then
            echo "::error title=linux release::--version exited $status"
            exit 1
          fi
          if [ "$output" != "$expected" ]; then
            echo "::error title=linux release::asset/tag version mismatch: tag $TAG requires '$expected' but the Linux executable printed '$output'"
            exit 1
          fi
          echo "verified: the Linux executable prints the tagged version $version"

      - name: Rename the executable and write SHA256SUMS.linux
        id: checksum
        run: |
          set -euo pipefail
          src=target/release/lovelace-desktop
          asset=lovelace-desktop-linux-x86_64
          cp "$src" "$asset"
          chmod +x "$asset"
          size=$(stat -c %s "$asset")
          hash=$(sha256sum "$asset" | awk '{print $1}')
          # Same sha256sum format as the Windows file, and a platform-qualified
          # name so the two checksum files cannot be confused.
          printf '%s  %s\n' "$hash" "$asset" > SHA256SUMS.linux
          echo "wrote $asset ($size bytes, sha256 $hash)"
          cat SHA256SUMS.linux
          # The checksum file must describe the bytes that will be uploaded.
          sha256sum -c SHA256SUMS.linux
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"

      - name: Attach the Linux executable and its checksum to the release
        env:
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --clobber makes a re-run of this job safe: it replaces only these two
          # Linux-named assets and never creates or edits the release itself.
          gh release upload "$TAG" --repo "$REPO" --clobber \
            lovelace-desktop-linux-x86_64 SHA256SUMS.linux

      # The bytes in the release, not the bytes on the build disk, are what users
      # get: download them back, check the checksum and run --version once more.
      - name: Verify the uploaded asset against SHA256SUMS.linux
        env:
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p verify-linux
          cd verify-linux
          gh release download "$TAG" --repo "$REPO" \
            --pattern lovelace-desktop-linux-x86_64 \
            --pattern SHA256SUMS.linux \
            --dir .
          sha256sum -c SHA256SUMS.linux
          chmod +x lovelace-desktop-linux-x86_64
          status=0
          output=$(./lovelace-desktop-linux-x86_64 --version 2>&1) || status=$?
          echo "downloaded asset --version -> '$output' (exit $status)"
          expected="lovelace-desktop ${TAG#v}"
          if [ "$status" -ne 0 ] || [ "$output" != "$expected" ]; then
            echo "::error title=linux release::the uploaded asset does not print '$expected' (got '$output', exit $status)"
            exit 1
          fi

      # The job's success must mean the release really carries the files. This
      # reads the release back through the API, so an upload that reported success
      # but did not attach both files fails here.
      - name: Verify the release carries both Linux assets
        env:
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
          EXPECTED_SIZE: ${{ steps.checksum.outputs.size }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"')
          echo "$assets"
          printf '%s\n' "$assets" | grep -qx "lovelace-desktop-linux-x86_64 $EXPECTED_SIZE" \
            || { echo "::error title=linux release::lovelace-desktop-linux-x86_64 is missing or has the wrong size"; exit 1; }
          printf '%s\n' "$assets" | grep -q '^SHA256SUMS.linux ' \
            || { echo "::error title=linux release::SHA256SUMS.linux is missing"; exit 1; }
          printf '%s\n' "$assets" | grep -q '^lovelace-desktop.exe ' \
            || { echo "::error title=linux release::the Windows executable is missing from the release"; exit 1; }
          printf '%s\n' "$assets" | grep -q '^SHA256SUMS.windows ' \
            || { echo "::error title=linux release::SHA256SUMS.windows is missing from the release"; exit 1; }
          echo "release $TAG carries the Windows and Linux executables and both checksum files"
